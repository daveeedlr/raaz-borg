name: Athlete intake database checks
on:
  push:
    paths: ['supabase/**', '.github/workflows/athlete-intake.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/athlete-intake.yml']
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Provide Supabase Auth interfaces in the disposable database
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema auth;
          create table auth.users(id uuid primary key, email text, email_confirmed_at timestamptz, created_at timestamptz not null default now());
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          -- The legacy table predates the repository's intake migrations.
          -- Reconstruct only its shape for disposable migration regression tests.
          create table public.fighter_registrations(
            id bigint generated by default as identity primary key,
            user_id uuid references auth.users(id) on delete cascade,
            realm text not null, first_name text not null, last_name text not null,
            nickname text not null, date_of_birth date not null, age integer not null,
            weight numeric not null, weight_unit text not null,
            height numeric not null, height_unit text not null,
            gym_name text not null, belt_rank text not null, belt_stripes integer not null,
            country text not null, state_province text not null, city text not null,
            email text not null, payment_option text not null,
            created_at timestamptz not null default now(),
            username text not null, avatar_path text
          );
          alter table public.fighter_registrations enable row level security;
          create policy "Fighters can view their own profile"
            on public.fighter_registrations for select to authenticated
            using ((select auth.uid())=user_id);
          SQL
      - name: Apply migrations and exercise athlete and reviewer roles
        run: |
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/intake.sql
